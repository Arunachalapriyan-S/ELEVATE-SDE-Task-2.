<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Applications · CredVault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/style.css">
</head>
<body data-root="../../" data-page="applications">
<header id="site-header"></header>
<main>

<div class="toolbar"><div><h1>Applications</h1><p class="lede" style="margin:0">Review requests and issue or reject them.</p></div></div>
<div class="table-wrap">
<table>
  <thead><tr><th>Application ID</th><th>Name</th><th>Phone</th><th>Gender</th><th>City</th><th>State</th><th>Status</th><th>Action</th></tr></thead>
  <tbody id="rows"></tbody>
</table>
</div>
<p class="note">Changes are saved in this browser only. <button class="linkbtn" id="reset" type="button">Reset demo data</button></p>

</main>
<footer id="site-footer"></footer>
<script src="../../assets/app.js"></script>
<script>

CV.requireAdmin("../../");
const rows = document.getElementById("rows");
function render() {
  const apps = CV.apps();
  if (!apps.length) { rows.innerHTML = '<tr><td colspan="8" class="empty">No applications yet.</td></tr>'; return; }
  rows.innerHTML = apps.map(a => {
    const pending = a.status === "Pending";
    return '<tr><td>' + CV.esc(a.id) + '</td><td>' + CV.esc(a.name) + '</td><td>' + CV.esc(a.phone) + '</td><td>' + CV.esc(a.gender) +
      '</td><td>' + CV.esc(a.city) + '</td><td>' + CV.esc(a.state) + '</td><td>' + CV.badge(a.status) +
      '</td><td class="actions-cell"><button class="btn sm" data-issue="' + a.id + '"' + (pending ? "" : " disabled") + '>Issue</button>' +
      '<button class="btn sm danger" data-reject="' + a.id + '"' + (pending ? "" : " disabled") + '>Reject</button></td></tr>';
  }).join("");
}
rows.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.issue) CV.issue(t.dataset.issue);
  if (t.dataset.reject) CV.reject(t.dataset.reject);
  render();
});
document.getElementById("reset").addEventListener("click", () => { if (confirm("Reset all demo data?")) { CV.reset(); render(); } });
render();

</script>
</body>
</html>
