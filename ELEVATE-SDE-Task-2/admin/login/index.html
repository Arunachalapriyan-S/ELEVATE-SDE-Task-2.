<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Login · CredVault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/style.css">
</head>
<body data-root="../../" data-page="login">
<header id="site-header"></header>
<main>

<div class="narrow">
  <h1>Admin Login</h1>
  <p class="lede">Sign in to manage applications and certificates.</p>
  <form id="form" class="panel" novalidate>
    <div class="hint">Demo credentials: username <b>admin</b>, password <b>admin</b></div>
    <div class="field"><label for="user">Username</label>
      <input type="text" id="user" autocomplete="username"><p class="err" data-for="user"></p></div>
    <div class="field"><label for="pass">Password</label>
      <input type="password" id="pass" autocomplete="current-password"><p class="err" data-for="pass"></p></div>
    <p class="err" id="formErr" role="alert"></p>
    <button class="btn" type="submit">Log in</button>
  </form>
</div>

</main>
<footer id="site-footer"></footer>
<script src="../../assets/app.js"></script>
<script>

if (CV.isAdmin()) location.replace("../applications/index.html");
const u = document.getElementById("user"), p = document.getElementById("pass"), fe = document.getElementById("formErr");
const setErr = (k, el, msg) => { document.querySelector('[data-for="' + k + '"]').textContent = msg; el.classList.toggle("invalid", !!msg); };
document.getElementById("form").addEventListener("submit", e => {
  e.preventDefault(); fe.textContent = "";
  const uv = u.value.trim(), pv = p.value;
  setErr("user", u, uv ? "" : "Enter your username.");
  setErr("pass", p, pv ? "" : "Enter your password.");
  if (!uv || !pv) return;
  if (CV.login(uv, pv)) location.href = "../applications/index.html";
  else fe.textContent = "Incorrect username or password.";
});

</script>
</body>
</html>
