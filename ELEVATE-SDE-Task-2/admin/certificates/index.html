<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Certificates · CredVault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/style.css">
</head>
<body data-root="../../" data-page="certificates">
<header id="site-header"></header>
<main>

<div class="toolbar"><div><h1>Certificates</h1><p class="lede" style="margin:0">Issued certificates. Revoke any that should no longer be valid.</p></div></div>
<div class="table-wrap">
<table>
  <thead><tr><th>Certificate ID</th><th>Name</th><th>Phone</th><th>City</th><th>State</th><th>Issued On</th><th>Status</th><th>Action</th></tr></thead>
  <tbody id="rows"></tbody>
</table>
</div>
<p class="note">Issue a certificate from the <a href="../applications/index.html">Applications</a> page and it appears here.</p>

</main>
<footer id="site-footer"></footer>
<script src="../../assets/app.js"></script>
<script>

CV.requireAdmin("../../");
const rows = document.getElementById("rows");
function render() {
  const certs = CV.certs();
  if (!certs.length) { rows.innerHTML = '<tr><td colspan="8" class="empty">No certificates issued yet.</td></tr>'; return; }
  rows.innerHTML = certs.map(c =>
    '<tr><td>' + CV.esc(c.id) + '</td><td>' + CV.esc(c.name) + '</td><td>' + CV.esc(c.phone) + '</td><td>' + CV.esc(c.city) +
    '</td><td>' + CV.esc(c.state) + '</td><td>' + CV.fmt(c.issuedOn) + '</td><td>' + CV.badge(c.status) +
    '</td><td><button class="btn sm danger" data-revoke="' + c.id + '"' + (c.status === "Valid" ? "" : " disabled") + '>Revoke</button></td></tr>'
  ).join("");
}
rows.addEventListener("click", e => {
  const t = e.target.closest("button[data-revoke]"); if (!t) return;
  if (confirm("Revoke " + t.dataset.revoke + "? Verification will show it as Revoked.")) { CV.revoke(t.dataset.revoke); render(); }
});
render();

</script>
</body>
</html>
