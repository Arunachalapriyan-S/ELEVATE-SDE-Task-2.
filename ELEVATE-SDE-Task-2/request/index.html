<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Request Certificate · CredVault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/style.css">
</head>
<body data-root="../" data-page="request">
<header id="site-header"></header>
<main>

<div class="narrow">
  <h1>Request Certificate</h1>
  <p class="lede">Fill in your details. You will get an Application ID to track your request.</p>
  <form id="form" class="panel" novalidate>
    <div class="field"><label for="name">Name</label>
      <input type="text" id="name" autocomplete="name"><p class="err" data-for="name"></p></div>
    <div class="field"><label for="phone">Phone</label>
      <input type="tel" id="phone" inputmode="numeric" maxlength="10" autocomplete="tel" placeholder="10-digit mobile number"><p class="err" data-for="phone"></p></div>
    <fieldset><legend>Gender</legend>
      <div class="radios">
        <label><input type="radio" name="gender" value="Male"> Male</label>
        <label><input type="radio" name="gender" value="Female"> Female</label>
        <label><input type="radio" name="gender" value="Other"> Other</label>
      </div><p class="err" data-for="gender"></p></fieldset>
    <div class="field"><label for="city">City</label>
      <input type="text" id="city" autocomplete="address-level2"><p class="err" data-for="city"></p></div>
    <div class="field"><label for="state">State</label>
      <select id="state"><option value="">Select state</option></select><p class="err" data-for="state"></p></div>
    <button class="btn" type="submit">Submit</button>
  </form>
  <div id="success" class="result ok" hidden role="status">
    <h2>Application submitted successfully!</h2>
    <p class="big-id">Application ID: <span id="appid"></span></p>
    <p>Save this ID. You need it to check your status.</p>
    <div class="actions"><a class="btn" id="trackLink" href="../track/index.html">Track Application</a>
    <button class="btn secondary" id="again" type="button">Submit another request</button></div>
  </div>
</div>

</main>
<footer id="site-footer"></footer>
<script src="../assets/app.js"></script>
<script>

const sel = document.getElementById("state");
CV.STATES.forEach(s => sel.add(new Option(s, s)));
const form = document.getElementById("form");
const setErr = (k, msg) => {
  const p = document.querySelector('[data-for="' + k + '"]'); if (p) p.textContent = msg || "";
  const el = document.getElementById(k); if (el) el.classList.toggle("invalid", !!msg);
};
function validate() {
  const v = {
    name: document.getElementById("name").value.trim(),
    phone: document.getElementById("phone").value.trim(),
    gender: (form.querySelector('input[name="gender"]:checked') || {}).value || "",
    city: document.getElementById("city").value.trim(),
    state: sel.value
  };
  let ok = true;
  const need = (k, msg) => { setErr(k, msg); if (msg) ok = false; };
  need("name", v.name ? "" : "Enter your name.");
  need("phone", !v.phone ? "Enter your phone number." : /^[6-9]\d{9}$/.test(v.phone) ? "" : "Enter a valid 10-digit mobile number.");
  need("gender", v.gender ? "" : "Select a gender.");
  need("city", v.city ? "" : "Enter your city.");
  need("state", v.state ? "" : "Select your state.");
  return ok ? v : null;
}
form.addEventListener("submit", e => {
  e.preventDefault();
  const v = validate(); if (!v) return;
  const app = CV.addApp(v);
  document.getElementById("appid").textContent = "#" + app.id;
  document.getElementById("trackLink").href = "../track/index.html?id=" + app.id;
  form.hidden = true;
  const s = document.getElementById("success"); s.hidden = false; s.focus && s.setAttribute("tabindex","-1"); s.focus();
});
document.getElementById("again").addEventListener("click", () => {
  form.reset(); form.hidden = false; document.getElementById("success").hidden = true;
});
document.getElementById("phone").addEventListener("input", e => { e.target.value = e.target.value.replace(/\D/g, ""); });

</script>
</body>
</html>
